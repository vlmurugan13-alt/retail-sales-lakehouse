
name: Databricks Notebook CI

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - '.github/workflows/databricks-notebook-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - '.github/workflows/databricks-notebook-ci.yml'

jobs:
  validate-notebooks:
    name: Validate Databricks Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebooks = list(Path("notebooks").rglob("*.ipynb"))

          if not notebooks:
              raise SystemExit("No notebooks found!")

          errors = []

          for notebook in notebooks:
              print(f"Checking: {notebook}")

              try:
                  data = json.loads(notebook.read_text(encoding="utf-8"))

                  if not isinstance(data.get("cells"), list):
                      raise ValueError("Missing notebook cells")

                  for index, cell in enumerate(data["cells"]):
                      if cell.get("cell_type") != "code":
                          continue

                      source = cell.get("source", [])
                      if isinstance(source, list):
                          source = "".join(source)

                      lines = source.splitlines()

                      # Skip cells using cell-level magic commands
                      if any(line.lstrip().startswith("%%") for line in lines):
                          print(f"  Skipping magic cell {index + 1}")
                          continue

                      # Remove Databricks/Jupyter line magic commands
                      cleaned = "\n".join(
                          line for line in lines
                          if not line.lstrip().startswith(("%", "!"))
                      )

                      if cleaned.strip():
                          ast.parse(cleaned, filename=str(notebook))

                  print("  PASS")

              except Exception as error:
                  errors.append(f"{notebook}: {error}")
                  print(f"  FAIL: {error}")

          if errors:
              raise SystemExit("\n".join(errors))

          print(f"\nSUCCESS: Validated {len(notebooks)} notebook(s).")
          PY
